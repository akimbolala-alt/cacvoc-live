
name: Update Church Live Status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube live status
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["YOUTUBE_API_KEY"]

          def youtube_api(endpoint, params):
              params["key"] = API_KEY
              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(params)
              )
              with urllib.request.urlopen(url, timeout=30) as response:
                  return json.load(response)

          # Find the church's channel automatically.
          channel_data = youtube_api("channels", {
              "part": "id",
              "forHandle": "@CacVocEdmonton"
          })

          channels = channel_data.get("items", [])
          if not channels:
              raise RuntimeError("Church YouTube channel not found.")

          channel_id = channels[0]["id"]
          print("Channel found:", channel_id)

          # Find an active public livestream.
          live_data = youtube_api("search", {
              "part": "snippet",
              "channelId": channel_id,
              "eventType": "live",
              "type": "video",
              "maxResults": 1
          })

          items = live_data.get("items", [])

          if items:
              video_id = items[0]["id"]["videoId"]
              status = {"isLive": True, "videoId": video_id}
              print("Church is LIVE:", video_id)
          else:
              status = {"isLive": False, "videoId": ""}
              print("Church is currently offline.")

          with open("live.json", "w") as file:
              json.dump(status, file)
              file.write("\n")
          PY

      - name: Save live status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          if ! git diff --cached --quiet; then
            git commit -m "Update live status"
            git push
          fi
