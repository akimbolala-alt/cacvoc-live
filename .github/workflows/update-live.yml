name: Update Church Live Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install YouTube detection tool
        run: python -m pip install --upgrade yt-dlp

      - name: Check YouTube live status
        shell: bash
        run: |
          CHANNEL_URL="https://www.youtube.com/@CacVocEdmonton/live"

          VIDEO_ID=$(yt-dlp --no-playlist --print id "$CHANNEL_URL" 2>/dev/null | head -1 || true)

          LIVE_STATUS=""
          if [ -n "$VIDEO_ID" ]; then
            LIVE_STATUS=$(yt-dlp --print live_status "https://www.youtube.com/watch?v=$VIDEO_ID" 2>/dev/null | head -1 || true)
          fi

          echo "Detected video ID: $VIDEO_ID"
          echo "Live status: $LIVE_STATUS"

          if [ "$LIVE_STATUS" = "is_live" ] && [ -n "$VIDEO_ID" ]; then
            printf '{"isLive":true,"videoId":"%s"}\n' "$VIDEO_ID" > live.json
          else
            printf '{"isLive":false,"videoId":""}\n' > live.json
          fi
      - name: Save live status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "Update live status"
          git push
    
