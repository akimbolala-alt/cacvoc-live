name: Update Church Live Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube live status
        shell: bash
        run: |
          CHANNEL_URL="https://www.youtube.com/@CacVocEdmonton/live"
          HTML=$(curl -L -s -A "Mozilla/5.0" "$CHANNEL_URL")

          VIDEO_ID=$(echo "$HTML" | grep -oE '"canonicalBaseUrl":"/watch\?v=[A-Za-z0-9_-]{11}"' | head -1 | cut -d'=' -f2 | tr -d '"')
          echo "Detected video ID: $VIDEO_ID"
          echo "YouTube live flag: $(echo "$HTML" | grep -o '"isLiveNow":true' | head -1)"
          if echo "$HTML" | grep -q '"isLiveNow":true' && [ -n "$VIDEO_ID" ]; then
            printf '{"isLive":true,"videoId":"%s"}\n' "$VIDEO_ID" > live.json
          else
            printf '{"isLive":false,"videoId":""}\n' > live.json
          fi
      - name: Save live status
        run: |
          git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "Update live status"
          git push
    
