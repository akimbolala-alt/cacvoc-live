name: Update Church Live Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube live status
        run: |
          CHANNEL_URL="https://www.youtube.com/@CacVocEdmonton/live"
          HTML=$(curl -L -s "$CHANNEL_URL")

          VIDEO_ID=$(echo "$HTML" | grep -o '"videoId":"[^"]*"' | head -1 | cut -d'"' -f4)

          if echo "$HTML" | grep -q '"isLiveNow":true' && [ -n "$VIDEO_ID" ]; then
            echo "{\"isLive\": true, \"videoId\": \"$VIDEO_ID\"}" > live.json
          else
            echo "{\"isLive\": false, \"videoId\": \"\"}" > live.json
          fi

      - name: Save live status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "Update live status"
          git push
