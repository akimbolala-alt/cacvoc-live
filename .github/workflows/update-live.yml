
name: Update Church Live Status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: church-live-status
  cancel-in-progress: false

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check livestream status
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          with open("live-control.json", encoding="utf-8") as f:
              control = json.load(f)

          manual = control.get("manualMode") is True
          video_id = control.get("videoId", "")

          if manual:
              if not isinstance(video_id, str) or not re.fullmatch(
                  r"[A-Za-z0-9_-]{11}", video_id
              ):
                  raise ValueError("Manual mode requires a valid YouTube video ID.")

              status = {"isLive": True, "videoId": video_id}
              print("Manual livestream override enabled.")

          else:
              api_key = os.environ["YOUTUBE_API_KEY"]

              def youtube_api(endpoint, params):
                  params["key"] = api_key
                  url = (
                      "https://www.googleapis.com/youtube/v3/"
                      + endpoint
                      + "?"
                      + urllib.parse.urlencode(params)
                  )
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return json.load(response)

              channel_data = youtube_api("channels", {
                  "part": "id",
                  "forHandle": "@CacVocEdmonton"
              })

              channels = channel_data.get("items", [])
              if not channels:
                  raise RuntimeError("Church YouTube channel not found.")

              channel_id = channels[0]["id"]
              print("Channel found:", channel_id)

              live_data = youtube_api("search", {
                  "part": "snippet",
                  "channelId": channel_id,
                  "eventType": "live",
                  "type": "video",
                  "maxResults": 1
              })

              items = live_data.get("items", [])

              if items:
                  detected_id = items[0]["id"]["videoId"]
                  status = {"isLive": True, "videoId": detected_id}
                  print("Church is LIVE:", detected_id)
              else:
                  status = {"isLive": False, "videoId": ""}
                  print("Church is currently offline.")

          with open("live.json", "w", encoding="utf-8") as f:
              json.dump(status, f)
              f.write("\n")
          PY

      - name: Save live status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          if ! git diff --cached --quiet; then
            git commit -m "Update live status"
            git pull --rebase
            git push
          fi
